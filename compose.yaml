services:
  db:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_DB: advisory_dev
      POSTGRES_USER: advisory_migrator
      POSTGRES_PASSWORD: local-migrations-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - advisory-dev:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory_migrator -d advisory_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 1000
  scanner-update:
    profiles: [intake-tools]
    image: advisory-parser:0.3
    build: ./infra/parser
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    entrypoint: [freshclam]
    command: [--config-file=/signatures/freshclam.conf, --stdout]
    volumes:
      - ./local-data/clamav:/signatures
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ollama:
    profiles: [inference]
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "4096"
    mem_limit: 2g
    cpus: 2
    networks: [model-private]
    volumes:
      - advisory-models:/root/.ollama
  inference-gateway:
    profiles: [inference]
    build: ./infra/inference
    image: advisory-inference:0.4
    depends_on: [ollama]
    env_file: ./local-data/inference/inference.env
    ports: ["127.0.0.1:11435:8080"]
    mem_limit: 512m
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [model-private, gateway-local]
    volumes:
      - ./local-data/inference:/models:ro
      - ./infra/inference/models.lock.json:/app/models.lock.json:ro
networks:
  gateway-local: {}
  model-private:
    internal: true
volumes:
  advisory-models:
    external: true
    name: advisory-models
  advisory-dev:
