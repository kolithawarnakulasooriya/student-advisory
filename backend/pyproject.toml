[project]
name = "student-advisory-api"
version = "0.4.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.33",
    "pgvector>=0.5.1",
    "httpx>=0.28.1",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "PyYAML==6.0.3",
    "reportlab>=5.1.0",
    "python-docx>=1.2.0",
    "pypdf>=7.0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
