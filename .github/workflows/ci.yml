name: Advisory checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: advisory_migrator
          POSTGRES_PASSWORD: local-migrations-only
          POSTGRES_DB: advisory_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisory_migrator -d advisory_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.13.7
      - run: uv sync --project backend --frozen
      - run: python scripts/dev_env.py
      - name: Bootstrap disposable service roles
        run: |
          uv run --project backend python - <<'PY'
          import psycopg
          from pathlib import Path
          with psycopg.connect('postgresql://advisory_migrator:local-migrations-only@localhost/advisory_dev') as conn:
              conn.execute(Path('infra/local/init.sql').read_text())
          PY
      - name: Migrate and seed local database
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed seed --confirm-database advisory_dev
          uv run alembic check
      - name: Build isolated parser and update scanner signatures
        run: |
          docker compose build scanner-update
          python scripts/update_scanner.py
      - name: Real scanner extraction and OCR integration
        working-directory: backend
        run: RUN_PARSER_TESTS=1 uv run pytest tests/test_parser.py -q
      - name: Backend checks
        working-directory: backend
        run: |
          uv run ruff check .
          uv run mypy app
          uv run pytest
          uv run python -m app.contracts --check
      - name: Prepare and verify private CPU inference
        run: |
          python scripts/prepare_inference.py
          python scripts/start_inference.py --build
      - name: Real Ollama retrieval and advising acceptance
        working-directory: backend
        run: RUN_MODEL_TESTS=1 uv run pytest tests/test_real_models.py -q -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-model-results
          path: |
            local-data/real-model-report.json
            local-data/inference/runtime-observed.json
          if-no-files-found: ignore
      - run: python scripts/generate_postman.py --check
      - run: uv run --project backend python scripts/validate_package.py
      - run: npm ci
        working-directory: frontend
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run check-client
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm audit --omit=dev --audit-level=high
          npx playwright install --with-deps chromium
          npm run test:e2e
